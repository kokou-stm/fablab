{% extends 'base.html' %}

{% block content %}
<div style="display:grid;place-items:center;padding:24px 0 48px">
  <div class="c-carte">
    <div class="logo"><span class="ms" style="font-size:22px">lock_reset</span></div>
    <h1>Définir un nouveau mot de passe</h1>
    <p class="sous">
      Compte : <b>{{ user_obj.get_full_name|default:user_obj.username }}</b> (@{{ user_obj.username }})
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="champ">
        <label for="reset-password-1">Nouveau mot de passe</label>
        <div style="position:relative">
          <input type="password" id="reset-password-1" name="password" required placeholder="••••••••••••"
                 autocomplete="new-password" style="padding-right:96px" />
          <button type="button" class="btn n s" onclick="togglePasswordVisibility('reset-password-1', this)"
                  style="position:absolute;right:6px;top:50%;transform:translateY(-50%)">Afficher</button>
        </div>
      </div>

      <div class="champ">
        <label for="reset-password-2">Confirmer le mot de passe</label>
        <div style="position:relative">
          <input type="password" id="reset-password-2" name="confirm_password" required placeholder="••••••••••••"
                 autocomplete="new-password" style="padding-right:96px" />
          <button type="button" class="btn n s" onclick="togglePasswordVisibility('reset-password-2', this)"
                  style="position:absolute;right:6px;top:50%;transform:translateY(-50%)">Afficher</button>
        </div>
      </div>

      <button type="submit" class="btn p" style="width:100%;height:48px">
        <span class="ms">check</span> Valider mon mot de passe
      </button>
    </form>
  </div>
</div>
{% endblock %}

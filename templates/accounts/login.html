{% extends 'base.html' %}

{% block content %}
<div style="display:grid;place-items:center;padding:24px 0 48px">
  <div class="c-carte">
    <div class="logo">L</div>
    <h1>Connexion à votre espace</h1>
    <p class="sous">Accédez aux machines, réservations et projets de votre FabLab</p>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="champ">
        <label for="login-username">Nom d'utilisateur ou adresse e-mail</label>
        <input type="text" id="login-username" name="username" required placeholder="ex. pesquet_t" autocomplete="username" />
      </div>

      <div class="champ">
        <label for="login-password">Mot de passe</label>
        <div style="position:relative">
          <input type="password" id="login-password" name="password" required placeholder="••••••••"
                 autocomplete="current-password" style="padding-right:96px" />
          <button type="button" class="btn n s" onclick="togglePasswordVisibility('login-password', this)"
                  style="position:absolute;right:6px;top:50%;transform:translateY(-50%)">Afficher</button>
        </div>
        <div class="aide"><a href="{% url 'password_reset' %}">Mot de passe oublié ?</a></div>
      </div>

      <button type="submit" class="btn p" style="width:100%;height:48px">
        <span class="ms">login</span> Se connecter
      </button>
    </form>

    <div class="c-sep"></div>
    <p style="text-align:center;font-size:13.5px;color:var(--on-surface-variant);margin:0">
      Pas encore membre ? <a href="{% url 'signup' %}">Demander un accès</a>
    </p>
  </div>
</div>
{% endblock %}

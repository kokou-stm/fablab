{% extends 'base.html' %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);">
  <div style="text-align: center; margin-bottom: 28px;">
    <div style="width: 48px; height: 48px; background: var(--text); color: var(--bg); border-radius: 12px; display: grid; place-items: center; font-size: 24px; font-weight: 700; margin: 0 auto 12px auto;">
      🔑
    </div>
    <h1 style="font-size: 22px; font-weight: 700; margin: 0;">Mot de passe oublié ?</h1>
    <p style="color: var(--muted); font-size: 14px; margin: 6px 0 0 0;">Entrez votre Nom d'utilisateur ou Adresse Email pour recevoir vos accès.</p>
  </div>

  <form method="post" action="{% url 'password_reset' %}">
    {% csrf_token %}
    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Nom d'utilisateur ou Adresse Email :</label>
      <input type="text" name="email_or_username" required placeholder="ex: pesquet_t ou thomas@example.org" class="form-input" style="width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
    </div>

    <button type="submit" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 700; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer;">
      📩 Envoyer le lien & le rappel
    </button>
  </form>

  <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: var(--muted);">
    <a href="{% url 'login' %}" style="color: var(--text); font-weight: 600; text-decoration: underline;">← Retour à la connexion</a>
  </div>
</div>
{% endblock %}

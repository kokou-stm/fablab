{% extends 'base.html' %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);">
  <div style="text-align: center; margin-bottom: 28px;">
    <div style="width: 48px; height: 48px; background: var(--text); color: var(--bg); border-radius: 12px; display: grid; place-items: center; font-size: 24px; font-weight: 700; margin: 0 auto 12px auto;">
      ⚡
    </div>
    <h1 style="font-size: 22px; font-weight: 700; margin: 0;">Connexion Espace FabLab</h1>
    <p style="color: var(--muted); font-size: 14px; margin: 6px 0 0 0;">Accédez aux machines, réservations et projets de votre FabLab</p>
  </div>

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <div style="margin-bottom: 18px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Nom d'utilisateur ou Email</label>
      <input type="text" name="username" required placeholder="ex: pesquet_t" class="form-input" style="width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
    </div>

    <div style="margin-bottom: 24px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
        <label style="font-size: 13px; font-weight: 600;">Mot de passe</label>
        <a href="{% url 'password_reset' %}" style="font-size: 12px; color: var(--muted); text-decoration: underline; font-weight: 500;">Mot de passe oublié ?</a>
      </div>
      <div style="position: relative;">
        <input type="password" id="login-password" name="password" required placeholder="••••••••" class="form-input" style="width: 100%; padding: 10px 85px 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
        <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 8px;">
          Afficher
        </button>
      </div>
    </div>

    <button type="submit" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 700; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer;">
      Se Connecter
    </button>
  </form>

  <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: var(--muted);">
    Pas encore membre ? <a href="{% url 'signup' %}" style="color: var(--text); font-weight: 600; text-decoration: underline;">S'inscrire ici</a>
  </div>
</div>
{% endblock %}

name: Deploy LabOS to Azure ACI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Noms des ressources Azure (non sensibles) — secrets réservés aux identifiants.
env:
  RESOURCE_GROUP: rg-labos
  LOCATION: francecentral
  ACR_NAME: labosacrzrlsfo
  STORAGE_ACCOUNT: labosdatazrlsfo
  SHARE_NAME: labos-data
  CONTAINER_NAME: aci-labos
  DNS_LABEL: labos-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Image to Azure Container Registry
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "labos:${{ github.sha }}" \
            --image labos:latest .

      - name: Deploy to Azure Container Instances
        run: |
          ACR_PASS=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          ST_KEY=$(az storage account keys list -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" --query "[0].value" -o tsv)

          echo "Suppression de l'ancien conteneur..."
          az container delete -g "$RESOURCE_GROUP" -n "$CONTAINER_NAME" --yes || true

          echo "Création du conteneur avec l'image ${{ github.sha }}..."
          az container create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --location "$LOCATION" \
            --os-type Linux \
            --image "${ACR_NAME}.azurecr.io/labos:${{ github.sha }}" \
            --registry-login-server "${ACR_NAME}.azurecr.io" \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_PASS" \
            --dns-name-label "$DNS_LABEL" \
            --ports 80 \
            --cpu 1 --memory 1.5 \
            --azure-file-volume-account-name "$STORAGE_ACCOUNT" \
            --azure-file-volume-account-key "$ST_KEY" \
            --azure-file-volume-share-name "$SHARE_NAME" \
            --azure-file-volume-mount-path /home/data \
            --environment-variables \
              PORT=80 \
              DJANGO_DEBUG=0 \
              DJANGO_ALLOWED_HOSTS="*" \
              DJANGO_DATA_DIR="/home/data" \
              USE_PROD_POSTGRES=1 \
              USE_POSTGRES=0 \
              DJANGO_BASE_DOMAIN="aidubber.fr" \
              EMAIL_HOST_USER="voicetranslator0@gmail.com" \
              DEFAULT_FROM_EMAIL="LabOS Platform <voicetranslator0@gmail.com>" \
            --secure-environment-variables \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              DJANGO_ADMIN_PASSWORD="${{ secrets.DJANGO_ADMIN_PASSWORD }}" \
              EMAIL_HOST_PASSWORD="${{ secrets.EMAIL_HOST_PASSWORD }}"

      - name: Verify Live Deployment
        run: |
          FQDN=$(az container show -g "$RESOURCE_GROUP" -n "$CONTAINER_NAME" --query "ipAddress.fqdn" -o tsv)
          echo "URL : http://${FQDN}"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://${FQDN}/login/" || echo 000)
            echo "tentative $i : HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 15
          done
          echo "L'application n'a pas répondu 200 après 5 minutes."
          az container logs -g "$RESOURCE_GROUP" -n "$CONTAINER_NAME" | tail -40
          exit 1

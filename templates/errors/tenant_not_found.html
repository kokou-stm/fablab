<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Espace introuvable — LabOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Page autonome : servie avant la résolution de l'établissement,
       les jetons Material y sont donc repris en ligne. */
    :root{
      --primary:#0066BA; --on-primary:#FFFFFF;
      --bg:#F0F4F9; --surface:#FFFFFF; --s-container:#EDF1F7;
      --on-surface:#1A1B1F; --on-surface-variant:#44474E; --outline:#74777F; --outline-variant:#C4C6CF;
      --e2:0 1px 2px 0 rgba(60,64,67,.30), 0 2px 6px 2px rgba(60,64,67,.15);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --primary:#A8C7FA; --on-primary:#062E6F;
        --bg:#131314; --surface:#1B1B1C; --s-container:#232425;
        --on-surface:#E3E3E3; --on-surface-variant:#C4C7C5; --outline:#8E918F; --outline-variant:#444746;
        --e2:0 1px 2px 0 rgba(0,0,0,.5), 0 2px 6px 2px rgba(0,0,0,.3);
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;
      background:var(--bg);color:var(--on-surface);
      font-family:Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:20px;
      -webkit-font-smoothing:antialiased;
    }
    .carte{
      width:min(460px,100%);background:var(--surface);border-radius:28px;
      padding:40px 36px;text-align:center;box-shadow:var(--e2);
    }
    .logo{
      width:44px;height:44px;margin:0 auto 20px;border-radius:12px;
      background:var(--primary);color:var(--on-primary);
      display:grid;place-items:center;font-size:20px;font-weight:700;
    }
    .code{
      display:inline-flex;align-items:center;height:24px;padding:0 12px;margin-bottom:14px;
      border-radius:8px;background:var(--s-container);color:var(--on-surface-variant);
      font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
    }
    h1{font-size:24px;line-height:32px;font-weight:400;margin:0 0 10px}
    p{font-size:14px;line-height:21px;color:var(--on-surface-variant);margin:0 0 8px}
    .host{
      display:inline-block;margin:6px 0 16px;padding:6px 12px;border-radius:8px;
      background:var(--s-container);color:var(--on-surface);
      font-family:'Roboto Mono',ui-monospace,monospace;font-size:13px;
    }
    .actions{margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    a.btn{
      display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 24px;
      border-radius:999px;border:1px solid var(--outline);background:transparent;color:var(--primary);
      font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;
    }
    a.btn.primary{background:var(--primary);border-color:transparent;color:var(--on-primary)}
  </style>
</head>
<body>
  <div class="carte">
    <div class="logo">L</div>
    <div class="code">Erreur 404 · espace introuvable</div>
    <h1>Aucun FabLab à cette adresse</h1>
    <p>Le sous-domaine saisi n'est associé à aucun espace enregistré sur LabOS :</p>
    <span class="host">{{ host }}</span>
    <p>Vérifiez l'orthographe, ou demandez le bon lien au responsable de votre établissement.</p>
    <div class="actions">
      <a class="btn primary" href="https://fablab.{{ base_domain }}/">Accéder à LabOS</a>
      <a class="btn" href="https://{{ base_domain }}/">Site principal</a>
    </div>
  </div>
</body>
</html>

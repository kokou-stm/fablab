name: CI-CD Pipeline - FabOS Multi-Tenant

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build and Test Django App
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fabos_db
          POSTGRES_USER: fabos_user
          POSTGRES_PASSWORD: fabos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django System Check
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          DEBUG: "False"
          DB_ENGINE: "django.db.backends.postgresql"
          DB_NAME: "fabos_db"
          DB_USER: "fabos_user"
          DB_PASSWORD: "fabos_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
        run: |
          python manage.py check

      - name: Run Unit Tests
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          DEBUG: "False"
          DB_ENGINE: "django.db.backends.postgresql"
          DB_NAME: "fabos_db"
          DB_USER: "fabos_user"
          DB_PASSWORD: "fabos_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
        run: |
          python manage.py test

  deploy:
    name: Deploy to Production Server
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "Starting FabOS Deployment..."
            cd /var/www/fablab
            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart fabos
            echo "FabOS successfully deployed!"

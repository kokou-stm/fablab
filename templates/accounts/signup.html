{% extends 'base.html' %}

{% block content %}
<div style="max-width: 520px; margin: 30px auto; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);">
  <div style="text-align: center; margin-bottom: 24px;">
    <h1 style="font-size: 22px; font-weight: 700; margin: 0;">Inscription Nouveau Membre</h1>
    {% if tenant %}
      <p style="color: var(--muted); font-size: 14px; margin: 6px 0 0 0;">Rejoignez l'espace <strong>{{ tenant.name }}</strong></p>
    {% else %}
      <p style="color: var(--muted); font-size: 14px; margin: 6px 0 0 0;">Rejoignez la communauté des Makers FabOS</p>
    {% endif %}
  </div>

  <form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Prénom</label>
        <input type="text" name="first_name" required placeholder="Thomas" class="form-input" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
      </div>
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Nom</label>
        <input type="text" name="last_name" required placeholder="Pesquet" class="form-input" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
      </div>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Nom d'utilisateur</label>
      <input type="text" name="username" required placeholder="pesquet_t" class="form-input" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Adresse Email</label>
      <input type="email" name="email" required placeholder="thomas@example.org" class="form-input" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Téléphone</label>
      <input type="text" name="phone" placeholder="+33 6 12 34 56 78" class="form-input" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Statut / Profil</label>
      <select name="role" class="form-select" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);">
        <option value="MAKER">Maker Résident (Prototypage & Création)</option>
        <option value="STUDENT">Étudiant / Stagiaire (Tarif Réduit)</option>
        <option value="INSTRUCTOR">Formateur / Intervenant</option>
      </select>
    </div>

    <div style="margin-bottom: 24px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Mot de passe</label>
      <input type="password" name="password" required placeholder="••••••••" class="form-input" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
    </div>

    <button type="submit" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 700; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer;">
      Créer mon Compte Membre
    </button>
  </form>

  <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--muted);">
    Déjà inscrit ? <a href="{% url 'login' %}" style="color: var(--text); font-weight: 600; text-decoration: underline;">Se connecter</a>
  </div>
</div>
{% endblock %}

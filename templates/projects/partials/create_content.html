<div style="max-width:760px;margin:0 auto">
  <div class="entete">
    <a class="btn n s" href="{% url 'project_list' %}" hx-get="{% url 'project_list' %}"
       hx-target="#content" hx-push-url="true">
      <span class="ms">arrow_back</span> Retour à la galerie
    </a>
    <h1 style="margin-top:10px">Publier un projet maker</h1>
    <p>Partagez vos tutoriels, modèles 3D, fichiers vectoriels et documentations open source.</p>
  </div>

  <div class="carte">
    <div class="corps" style="padding:24px">
      <form method="post" enctype="multipart/form-data" action="{% url 'project_create' %}">
        {% csrf_token %}

        <div class="champ">
          <label for="pj-titre">Titre du projet</label>
          <input type="text" id="pj-titre" name="title" required
                 placeholder="ex. boîtier de capteur IoT en découpe laser">
        </div>

        <div class="grille g2" style="gap:0 16px">
          <div class="champ">
            <label for="pj-cat">Domaine / spécialité</label>
            <select id="pj-cat" name="category">
              <option value="Impression 3D &amp; Prototypage">Impression 3D &amp; prototypage</option>
              <option value="Découpe Laser &amp; Gravure">Découpe laser &amp; gravure</option>
              <option value="Usinage CNC &amp; Bois">Usinage CNC &amp; bois</option>
              <option value="Électronique &amp; IoT">Électronique &amp; IoT</option>
              <option value="Design &amp; Modélisation CAD">Design &amp; modélisation CAO</option>
            </select>
          </div>
          <div class="champ">
            <label for="pj-lic">Licence open source</label>
            <select id="pj-lic" name="license">
              <option value="CC-BY-SA">Creative Commons BY-SA 4.0</option>
              <option value="CC-BY-NC">Creative Commons non commerciale</option>
              <option value="MIT">Licence MIT</option>
              <option value="CERN-OHL">CERN Open Hardware Licence</option>
            </select>
          </div>
        </div>

        <div class="champ">
          <label for="pj-desc">Description &amp; étapes d'assemblage</label>
          <textarea id="pj-desc" name="description" required style="min-height:140px"
                    placeholder="Matériel nécessaire, temps d'usinage, paramètres de découpe ou d'impression, notice de montage…"></textarea>
        </div>

        <div class="champ">
          <label for="pj-img">Photo de couverture</label>
          <input type="file" id="pj-img" name="cover_image" accept="image/*" style="height:auto;padding:12px 16px">
        </div>

        <label class="choix" style="margin-bottom:24px">
          <input type="checkbox" name="is_public" id="is_public" checked>
          <b style="display:inline">Projet public</b>
          <p>Visible dans la galerie open source du FabLab.</p>
        </label>

        <div style="display:flex;justify-content:flex-end;gap:8px">
          <a class="btn n" href="{% url 'project_list' %}" hx-get="{% url 'project_list' %}"
             hx-target="#content" hx-push-url="true">Annuler</a>
          <button type="submit" class="btn p"><span class="ms">publish</span> Publier le projet</button>
        </div>
      </form>
    </div>
  </div>
</div>

name: Deploy FabOS to Azure ACI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Image to Azure Container Registry
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ACR_NAME="${{ secrets.ACR_NAME }}"
          echo "Building image fabos:${IMAGE_TAG} and tagging as latest..."
          az acr build --registry "$ACR_NAME" --image fabos:${IMAGE_TAG} --image fabos:latest .

      - name: Deploy to Azure Container Instances (ACI)
        run: |
          IMAGE_TAG="${{ github.sha }}"
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          CONTAINER_NAME="${{ secrets.AZURE_CONTAINER_NAME || 'aci-fabos' }}"
          ACR_NAME="${{ secrets.ACR_NAME }}"
          STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          SHARE_NAME="${{ secrets.AZURE_SHARE_NAME || 'fabos-data' }}"
          DNS_LABEL="${{ secrets.AZURE_DNS_LABEL || 'fabos-app' }}"

          echo "Retrieving credentials..."
          ST_KEY=$(az storage account keys list -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" --query "[0].value" -o tsv)
          ACR_PASS=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)

          echo "Removing old container..."
          az container delete -g "$RESOURCE_GROUP" -n "$CONTAINER_NAME" --yes || true

          echo "Creating container with image fabos:${IMAGE_TAG}..."
          az container create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --location francecentral \
            --os-type Linux \
            --image "${ACR_NAME}.azurecr.io/fabos:${IMAGE_TAG}" \
            --registry-login-server "${ACR_NAME}.azurecr.io" \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_PASS" \
            --dns-name-label "$DNS_LABEL" \
            --ports 80 \
            --cpu 1 --memory 1.5 \
            --azure-file-volume-account-name "$STORAGE_ACCOUNT" \
            --azure-file-volume-account-key "$ST_KEY" \
            --azure-file-volume-share-name "$SHARE_NAME" \
            --azure-file-volume-mount-path /home/data \
            --environment-variables \
              PORT=80 \
              DJANGO_DEBUG=0 \
              DJANGO_ALLOWED_HOSTS="*" \
              DJANGO_DATA_DIR="/home/data" \
              USE_LOCAL_DB=0 \
              USE_PROD_POSTGRES=1 \
              USE_POSTGRES=0 \
            --secure-environment-variables \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"

      - name: Verify Live Deployment
        run: |
          echo "Waiting 15 seconds for container startup..."
          sleep 15
          CONTAINER_FQDN=$(az container show -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ secrets.AZURE_CONTAINER_NAME || 'aci-fabos' }}" --query "ipAddress.fqdn" -o tsv || echo "")
          echo "Container FQDN: $CONTAINER_FQDN"
          if [ -n "$CONTAINER_FQDN" ]; then
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${CONTAINER_FQDN}/" || echo "000")
            echo "HTTP Status Code: $STATUS_CODE"
          fi
          echo "Deployment verified successfully."

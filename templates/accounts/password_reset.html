{% extends 'base.html' %}

{% block content %}
<div style="display:grid;place-items:center;padding:24px 0 48px">
  <div class="c-carte">
    <div class="logo"><span class="ms" style="font-size:22px">key</span></div>
    <h1>Mot de passe oublié ?</h1>
    <p class="sous">Indiquez votre nom d'utilisateur ou votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

    <form method="post" action="{% url 'password_reset' %}">
      {% csrf_token %}
      <div class="champ">
        <label for="pr-id">Nom d'utilisateur ou adresse e-mail</label>
        <input type="text" id="pr-id" name="email_or_username" required
               placeholder="ex. pesquet_t ou thomas@example.org" />
      </div>

      <button type="submit" class="btn p" style="width:100%;height:48px">
        <span class="ms">send</span> Envoyer le lien
      </button>
    </form>

    <a class="c-retour" href="{% url 'login' %}">← Retour à la connexion</a>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);">
  <div style="text-align: center; margin-bottom: 28px;">
    <div style="width: 48px; height: 48px; background: var(--text); color: var(--bg); border-radius: 12px; display: grid; place-items: center; font-size: 24px; font-weight: 700; margin: 0 auto 12px auto;">
      🔐
    </div>
    <h1 style="font-size: 22px; font-weight: 700; margin: 0;">Définir un Nouveau Mot de Passe</h1>
    <p style="color: var(--muted); font-size: 14px; margin: 6px 0 0 0;">Compte : <strong>{{ user_obj.get_full_name|default:user_obj.username }}</strong> (@{{ user_obj.username }})</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 18px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Nouveau Mot de passe :</label>
      <div style="position: relative;">
        <input type="password" id="reset-password-1" name="password" required placeholder="••••••••••••" class="form-input" style="width: 100%; padding: 10px 85px 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
        <button type="button" onclick="togglePasswordVisibility('reset-password-1', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 8px;">
          Afficher
        </button>
      </div>
    </div>

    <div style="margin-bottom: 24px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Confirmer le Nouveau Mot de passe :</label>
      <div style="position: relative;">
        <input type="password" id="reset-password-2" name="confirm_password" required placeholder="••••••••••••" class="form-input" style="width: 100%; padding: 10px 85px 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);" />
        <button type="button" onclick="togglePasswordVisibility('reset-password-2', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 8px;">
          Afficher
        </button>
      </div>
    </div>

    <button type="submit" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 700; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer;">
      ✓ Valider le Nouveau Mot de Passe
    </button>
  </form>
</div>
{% endblock %}
